<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#03050b" />
  <title>Artemis II – Launch &amp; Dodge</title>
</head>
<body>
  <div id="app">
    <div id="stage"></div>

    <div id="loading" class="screen">
      <div class="loading-box">
        <div class="loading-title">ARTEMIS II</div>
        <div class="loading-bar"><div id="loading-fill"></div></div>
        <div id="loading-text">Modell wird geladen … 0 %</div>
      </div>
    </div>

    <div id="title" class="screen hidden">
      <div class="title-box">
        <p class="kicker">SLS · Orion · Mondmission</p>
        <h1>Artemis II</h1>
        <button id="btn-start" class="btn primary">Start</button>
        <p class="hint only-desktop">Steuern mit WASD oder Pfeiltasten · Start mit Leertaste</p>
        <p class="hint only-touch">Zum Steuern auf dem Bildschirm ziehen</p>
        <p id="title-best" class="best"></p>
      </div>
    </div>

    <div id="countdown" class="hidden">
      <span class="countdown-label">T –</span>
      <span id="countdown-value">10</span>
    </div>
    <div id="callout" class="hidden"></div>
    <button id="btn-skip" class="btn ghost small hidden">Überspringen ⏩</button>

    <div id="hud">
      <div class="hud-panel hud-left">
        <div class="hud-label">Distanz</div>
        <div class="hud-value"><span id="hud-score">0</span><small> km</small></div>
        <div class="hud-sub">Rekord <span id="hud-best">0</span> km</div>
      </div>
      <div class="hud-panel hud-right">
        <div class="hud-label">Geschwindigkeit</div>
        <div class="hud-value"><span id="hud-speed">0,0</span><small> km/s</small></div>
      </div>
      <div id="shield" class="hud-panel">
        <div class="shield-label">Schild <span id="shield-time">5,0</span> s</div>
        <div class="shield-bar"><div id="shield-fill"></div></div>
      </div>
    </div>

    <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>

    <div id="gameover" class="screen hidden">
      <div class="gameover-box">
        <h2>Game Over</h2>
        <div class="go-score"><span id="go-score">0</span> km</div>
        <div id="go-record" class="record hidden">Neuer Rekord!</div>
        <div id="go-best" class="best"></div>
        <div class="go-buttons">
          <button id="btn-retry" class="btn primary">Nochmal</button>
          <button id="btn-home" class="btn ghost">Zurück zum Start</button>
        </div>
      </div>
    </div>

    <button id="btn-mute" class="icon-btn" aria-label="Ton an/aus" title="Ton an/aus (M)">🔊</button>
    <div id="flash"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
